name: Build and Test

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            qt6-base-dev \
            libqt6xml6 \
            libqscintilla2-qt6-dev \
            libzip-dev \
            cppcheck

      - name: Run cppcheck static analysis
        run: |
          cd frontend-user
          cppcheck --enable=warning,style,performance \
            --std=c++17 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            -I include \
            src/ include/
        continue-on-error: false

      - name: Configure CMake
        run: |
          cd frontend-user
          mkdir -p build
          cd build
          cmake ..

      - name: Build project
        run: |
          cd frontend-user/build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd frontend-user/build
          xvfb-run make test
